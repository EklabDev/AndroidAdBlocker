org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Gradle 8.14.5 cannot run on JDK 25 (embedded Kotlin compiler fails to parse "25.0.3").
# AGP 8.7.x requires JDK 17, so pin the Gradle JVM to the local JDK 17.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
